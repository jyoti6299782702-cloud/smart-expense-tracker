<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Chart.js CDN for interactive graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    
   <header class="app-header">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <h1>🌸 Smart Expense Tracker</h1>
      <p>Keep your finances clean, aesthetic & smart</p>
    </div>
    
    <!-- Theme Switcher Dropdown -->
    <div style="width: 140px;">
      <select id="theme-selector" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; cursor: pointer;">
        <option value="pink">🌸 Soft Pink</option>
        <option value="purple">💜 Lavender</option>
        <option value="dark">🌙 Dark Rose</option>
      </select>
    </div>
  </div>
</header>
    <!-- Top Summary Cards -->
    <div class="summary-grid">
      <div class="card balance-card">
        <span class="card-label">Total Balance</span>
        <h2 id="total-balance">₹0.00</h2>
      </div>
      <div class="card income-card">
        <span class="card-label">Total Income</span>
        <h2 id="total-income">₹0.00</h2>
      </div>
      <div class="card expense-card">
        <span class="card-label">Total Expense</span>
        <h2 id="total-expense">₹0.00</h2>
      </div>
    </div>

    <!-- Main Workspace (Form + Chart) -->
    <div class="workspace-grid">
      <!-- Left: Add Form -->
      <div class="card form-card">
        <h3>Add New Entry</h3>
        <form id="expense-form" onsubmit="return false;"></form>
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="title" placeholder="e.g., Cold Coffee, Rent" required>
          </div>

          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="amount" step="0.01" placeholder="e.g., 250" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Type</label>
              <select id="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
            </div>

            <div class="form-group">
              <label>Category</label>
              <select id="category">
                <option value="Food">Food & Drinks</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills & Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Travel">Travel</option>
                <option value="Salary">Salary</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <button type="button" onclick="addTransaction(event)">Add Transaction</button>
        </form>
      </div>

      <!-- Right: Chart -->
      <div class="card chart-card">
        <h3>Expense Distribution</h3>
        <div class="canvas-wrapper">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom: History -->
    <div class="card history-card">
      <h3>Transaction History</h3>
      <ul id="history-list" class="history-list"></ul>
    </div>

  </div>

  <script>
function getTransactions() {
    return JSON.parse(localStorage.getItem('my_expense_data')) || [];
}

function saveTransactions(data) {
    localStorage.setItem('my_expense_data', JSON.stringify(data));
}

function updateUI() {
    var transactions = getTransactions();
    var list = document.getElementById('transaction-list');
    var totalIncomeEl = document.getElementById('total-income');
    var totalExpenseEl = document.getElementById('total-expense');
    var netBalanceEl = document.getElementById('net-balance');

    var income = 0;
    var expense = 0;

    if (list) list.innerHTML = '';

    for (var i = transactions.length - 1; i >= 0; i--) {
        var t = transactions[i];
        var amt = parseFloat(t.amount) || 0;

        if (t.type === 'income') {
            income += amt;
        } else {
            expense += amt;
        }

        if (list) {
            var li = document.createElement('li');
            li.style.display = 'flex';
            li.style.justifyContent = 'space-between';
            li.style.padding = '10px';
            li.style.marginBottom = '8px';
            li.style.borderRadius = '8px';
            li.style.background = '#fff';
            li.style.borderLeft = t.type === 'income' ? '5px solid #2e7d32' : '5px solid #d32f2f';

            li.innerHTML = `
                <div>
                    <strong>${t.title}</strong><br>
                    <small style="color: #666;">${t.category} • ${t.date}</small>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-weight: bold; color: ${t.type === 'income' ? '#2e7d32' : '#d32f2f'};">
                        ${t.type === 'income' ? '+' : '-'}₹${amt.toFixed(2)}
                    </span>
                    <button style="background: none; border: none; cursor: pointer;" onclick="deleteItem(${i})">🗑️</button>
                </div>
            `;
            list.appendChild(li);
        }
    }

    if (totalIncomeEl) totalIncomeEl.innerText = '₹' + income.toFixed(2);
    if (totalExpenseEl) totalExpenseEl.innerText = '₹' + expense.toFixed(2);
    if (netBalanceEl) netBalanceEl.innerText = '₹' + (income - expense).toFixed(2);
}

function handleAddTransaction(event) {
    if (event) event.preventDefault();

    var titleInput = document.getElementById('title');
    var amountInput = document.getElementById('amount');
    var categoryInput = document.getElementById('category');
    var typeInput = document.getElementById('type');

    var title = titleInput ? titleInput.value.trim() : '';
    var amount = amountInput ? parseFloat(amountInput.value) : 0;
    var category = categoryInput ? categoryInput.value : 'General';
    var type = typeInput ? typeInput.value : 'expense';

    if (!title || isNaN(amount) || amount <= 0) {
        alert('Please enter valid Title and Amount!');
        return false;
    }

    var newTx = {
        title: title,
        amount: amount,
        category: category,
        type: type,
        date: new Date().toLocaleDateString('en-IN')
    };

    var transactions = getTransactions();
    transactions.push(newTx);
    saveTransactions(transactions);

    if (titleInput) titleInput.value = '';
    if (amountInput) amountInput.value = '';

    updateUI();
    return false;
}

function deleteItem(index) {
    var transactions = getTransactions();
    transactions.splice(index, 1);
    saveTransactions(transactions);
    updateUI();
}

window.onload = function() {
    var form = document.getElementById('expense-form');
    if (form) {
        form.onsubmit = handleAddTransaction;
    }
    updateUI();
};
</script>
</body>
</html>
